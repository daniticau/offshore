<meta charset="utf-8">
<link rel="stylesheet" href="src/renderer/src/theme/theme.css">
<link rel="stylesheet" href="src/renderer/src/start/start.css">
<style>
  body { background: linear-gradient(180deg,#d5f0fc,#b7e0f4); display:flex; }
  .pane { position:relative; flex:1; height:100vh; }
  .lbl { position:absolute; top:6px; left:12px; font:600 12px system-ui; color:#0b3c50; z-index:20 }
  .start { position:absolute; inset:0 }
  .start-stage { position:absolute; inset:0; display:grid; grid-template-rows:1fr auto 1fr; justify-items:center }
</style>
<div class="pane"><span class="lbl">NORMAL</span>
  <div class="start"><div class="start-stage"><div class="start-center" id="a"></div></div></div>
</div>
<div class="pane"><span class="lbl">EDITING</span>
  <div class="start editing"><div class="start-stage"><div class="start-center" id="b"></div></div></div>
</div>
<script>
  const html = `
    <div class="widget-slot align-center"><button class="widget-remove">−</button>
      <div class="widget-inner"><div class="clock clock-serif">10:42</div></div></div>
    <div class="widget-slot align-center"><button class="widget-remove">−</button>
      <div class="widget-inner"><div class="date">Sunday, August 10</div></div></div>
    <div class="widget-slot align-center"><button class="widget-remove">−</button>
      <div class="widget-inner"><div class="brief-line greet">Good morning.</div></div></div>`
  a.innerHTML = html; b.innerHTML = html
</script>
