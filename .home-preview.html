<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="src/renderer/src/theme/theme.css">
<link rel="stylesheet" href="src/renderer/src/start/start.css">
<style>
  body { margin: 0; background: #cfeafb; }
  .pane { position: relative; height: 100vh; }
</style>
<div class="pane">
  <div class="start" id="start" style="background: linear-gradient(180deg, #dff2fd 0%, #b9e0f5 100%)">
    <button class="we-done" id="done">Done</button>
    <div class="start-stage">
      <div class="start-center" id="center">
        <div class="widget-slot align-center">
          <button class="widget-remove">−</button>
          <div class="widget-inner"><div class="clock clock-serif">10:42</div></div>
        </div>
      </div>
      <div class="start-search" id="pill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input placeholder="Search or type a URL" id="input">
        <span class="start-measure" id="mirror"></span>
      </div>
    </div>
    <div class="we-tray" id="tray">
      <button class="we-tray-add"><span class="we-tray-badge">+</span>Date</button>
      <button class="we-tray-add"><span class="we-tray-badge">+</span>Greeting</button>
      <button class="we-tray-add"><span class="we-tray-badge">+</span>Weather</button>
    </div>
  </div>
</div>
<script>
  const input = document.getElementById('input')
  const mirror = document.getElementById('mirror')
  const pill = document.getElementById('pill')
  const host = document.getElementById('start')
  function measure() {
    mirror.textContent = input.value
    const avail = host.clientWidth
    const base = Math.min(600, avail * 0.68)
    const max = Math.max(base, Math.min(940, avail - 72))
    const pad = 22 * 2 + 18 + 12 + 10
    pill.style.width = Math.round(Math.min(max, Math.max(base, mirror.offsetWidth + pad))) + 'px'
  }
  input.addEventListener('input', measure)
  addEventListener('resize', measure)
  measure()
  // ?edit=1 shows edit mode; ?extra=1 adds more widgets
  const q = new URLSearchParams(location.search)
  if (q.get('edit')) document.getElementById('start').classList.add('editing')
  if (q.get('edit')) { document.getElementById('done').classList.add('on'); document.getElementById('tray').classList.add('on') }
  if (q.get('extra')) {
    const center = document.getElementById('center')
    const add = (cls, html, align) => {
      center.insertAdjacentHTML('beforeend',
        `<div class="widget-slot align-${align}"><button class="widget-remove">−</button><div class="widget-inner"><div class="${cls}">${html}</div></div></div>`)
    }
    add('date', 'Sunday, August 10', 'center')
    add('brief-line greet', 'Good morning.', 'left')
    add('widget-weather', '<strong>21°</strong> and clear<span class="brief-hilo">  H 24° · L 15°</span>', 'right')
    add('widget-line', '🌔 Waxing gibbous', 'center')
  }
  if (q.get('typed')) { input.value = q.get('typed'); measure() }
</script>
