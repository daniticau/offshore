appId: com.offshore.browser
productName: Offshore
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - "!**/.DS_Store"
asar: true
npmRebuild: false
# castLabs Electron for Content Security lives in its own releases repo —
# without this mirror, electron-builder 404s against upstream electron/electron
electronDownload:
  mirror: https://github.com/castlabs/electron-releases/releases/download/
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
    - target: dir
      arch:
        - arm64
  identity: null
dmg:
  title: Offshore
